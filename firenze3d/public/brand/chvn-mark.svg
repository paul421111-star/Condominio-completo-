<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 200 200" role="img" aria-label="Selo Cooperativa Habitacional Vida Nova">
  <defs>
    <linearGradient id="chvn-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="0.55" stop-color="#16a34a"/>
      <stop offset="1" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="chvn-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef08a"/>
      <stop offset="1" stop-color="#eab308"/>
    </linearGradient>
    <radialGradient id="chvn-navy" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#4c6ef5"/>
      <stop offset="1" stop-color="#1e2a6b"/>
    </radialGradient>
    <linearGradient id="chvn-building" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c7d2fe"/>
    </linearGradient>
    <path id="chvn-arc-top" d="M 17 100 A 83 83 0 0 1 183 100"/>
    <path id="chvn-arc-bottom" d="M 10 100 A 90 90 0 0 0 190 100"/>
    <filter id="chvn-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#facc15" flood-opacity="0.55"/>
    </filter>
  </defs>

  <circle cx="100" cy="100" r="98" fill="url(#chvn-ring)"/>
  <circle cx="100" cy="100" r="95" fill="none" stroke="#bbf7d0" stroke-opacity="0.5" stroke-width="1.5"/>

  <path d="M 100 22 L 178 100 L 100 178 L 22 100 Z" fill="url(#chvn-gold)" filter="url(#chvn-glow)"/>
  <path d="M 100 22 L 178 100 L 100 178 L 22 100 Z" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5"/>

  <text fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" font-size="10" letter-spacing="1.3">
    <textPath xlink:href="#chvn-arc-top" startOffset="50%" text-anchor="middle">COOPERATIVA HABITACIONAL</textPath>
  </text>
  <text fill="#ffffff" font-family="Sora, Inter, Segoe UI, Arial, sans-serif" font-weight="800" font-size="11.5" letter-spacing="2.2">
    <textPath xlink:href="#chvn-arc-bottom" startOffset="50%" text-anchor="middle">VIDA NOVA</textPath>
  </text>

  <circle cx="100" cy="100" r="50" fill="url(#chvn-navy)" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="100" cy="100" r="44" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>

  <g fill="url(#chvn-building)">
    <rect x="80" y="76" width="20" height="44" rx="2.5"/>
    <rect x="101" y="88" width="18" height="32" rx="2.5"/>
  </g>
  <g fill="#1e2a6b">
    <rect x="85" y="82" width="4" height="4" rx="0.8"/>
    <rect x="92" y="82" width="4" height="4" rx="0.8"/>
    <rect x="85" y="90" width="4" height="4" rx="0.8"/>
    <rect x="92" y="90" width="4" height="4" rx="0.8"/>
    <rect x="85" y="98" width="4" height="4" rx="0.8"/>
    <rect x="92" y="98" width="4" height="4" rx="0.8"/>
    <rect x="106" y="94" width="4" height="4" rx="0.8"/>
    <rect x="112" y="94" width="4" height="4" rx="0.8"/>
    <rect x="106" y="102" width="4" height="4" rx="0.8"/>
    <rect x="112" y="102" width="4" height="4" rx="0.8"/>
    <rect x="89" y="106" width="8" height="14" rx="1.5"/>
  </g>
  <rect x="78" y="118" width="46" height="2.5" rx="1" fill="#ffffff" fill-opacity="0.85"/>
</svg>
